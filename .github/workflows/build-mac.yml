name: Build macOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # Supabase için 20+ daha iyi olur
          cache: 'npm'

      - name: Install dependencies
        run: npm install # package-lock.json yoksa ci yerine install kullan

      # --- KRİTİK ADIM: .env DOSYASINI OLUŞTUR ---
      - name: Create .env file
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env

      - name: Build Vite frontend
        run: npx vite build

      - name: Install Playwright Browsers
        run: npx playwright install webkit --with-deps

      - name: Run Screenshot Test
        run: node screenshot-test.js

      - name: Upload Screenshot Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-visual-preview
          path: macos-preview.png

      - name: Package for macOS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # --never-publish ekledim ki çakışma hatası (already exists) almayasın, 
        # istersen kaldırabilirsin.
        run: npx electron-builder --mac --publish never 

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vulpax-dnd-mac
          path: |
            release/*.dmg
            release/*.zip
          retention-days: 7 # 30 gün çok yer kaplar, 7 ideal.